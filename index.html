<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advocacia Previdenciária Profissional</title>
    <style>
        :root {
            --primary: #1a2a40; 
            --gold: #c5a059;    
            --light: #f8f9fa;
            --dark: #333;
        }
        body { font-family: 'Georgia', serif; margin: 0; color: var(--dark); line-height: 1.6; background-color: var(--light); }
        header { background: var(--primary); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { color: var(--gold); font-size: 1.5rem; font-weight: bold; text-transform: uppercase; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-size: 0.9rem; font-family: 'Arial', sans-serif; }
        .hero { background: linear-gradient(rgba(26, 42, 64, 0.8), rgba(26, 42, 64, 0.8)), url('https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&q=80&w=1000') center/cover;
                height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: white; padding: 20px; }
        .section { padding: 60px 10%; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; margin-top: 40px; }
        .card { background: white; padding: 30px; border-top: 4px solid var(--gold); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn-whatsapp { background: #25d366; color: white; padding: 15px 30px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; margin-top: 20px; }
        footer { background: var(--primary); color: white; padding: 40px 10%; text-align: center; font-size: 0.8rem; }
    </style>
</head>
<body>
<header>
    <div class="logo">Advocacia Prev</div>
    <nav>
        <a href="#inicio">Início</a>
        <a href="#servicos">Especialidades</a>
        <a href="#contato">Contato</a>
    </nav>
</header>
